<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h2>Создать аккаунт</h2>
            <p>Присоединяйтесь к нам за пару кликов</p>
        </div>

        <div class="auth-body">
            <form action="#" method="post" id="register-form">
                <div class="form-group">
                    <label for="fullname">Ваше имя</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Иван Иванов" required>
                    <div class="error-msg" id="fullname-error"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
                    <div class="error-msg" id="email-error"></div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Придумайте пароль" required>
                    <div class="error-msg" id="password-error"></div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Повторите пароль</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Повторите пароль" required>
                    <div class="error-msg" id="confirm_password-error"></div>
                </div>

                <button type="submit" class="btn btn-success">Зарегистрироваться</button>
            </form>

            <div class="switch-link">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
